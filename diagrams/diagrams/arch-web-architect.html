<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Architect Diagram</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f5f5f5; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<svg role="img" aria-labelledby="arch-web-architect-title arch-web-architect-desc" viewBox="0 0 760 480" width="760" height="480" xmlns="http://www.w3.org/2000/svg">
  <title id="arch-web-architect-title">Web Architect Diagram</title>
  <desc id="arch-web-architect-desc">Web Architect Diagram diagram for baduk-notes documentation.</desc>
<defs>
    <marker id="wa-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4f5d75"/>
    </marker>
    <marker id="wa-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#eb6c36"/>
    </marker>
    <marker id="wa-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="480" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="380" y="28" font-family="'Instrument Serif', serif" font-size="17" fill="#2d3142" text-anchor="middle">Web Architect Diagram</text>
  <text x="380" y="44" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle" letter-spacing="0.12em">APPLICATION FILE INTERACTIONS · SCRIPT LOAD ORDER · SCORING PIPELINE</text>

  <!-- ── index.html focal node (top center) ── -->
  <rect x="248" y="60" width="264" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="380" y="80" font-family="'Geist', sans-serif" font-size="13" font-weight="600" fill="#2d3142" text-anchor="middle">index.html</text>
  <text x="380" y="95" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">UI shell · boards · modals · study mode</text>
  <text x="380" y="108" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">export · style palette · score estimate</text>

  <!-- ── Left side: manifest.json + sw.js ── -->
  <!-- Arrow: index.html → manifest.json (right exit) -->
  <path d="M512,80 H576 V104" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#wa-arr)"/>
  <rect x="521" y="72" width="50" height="12" rx="2" fill="#f5f5f5"/>
  <text x="546" y="81" font-family="'Geist Mono', monospace" font-size="7" fill="#4f5d75" text-anchor="middle">register</text>

  <!-- manifest.json -->
  <rect x="532" y="104" width="128" height="32" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
  <text x="596" y="120" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">manifest.json</text>
  <text x="596" y="131" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399" text-anchor="middle">PWA manifest</text>

  <!-- Arrow manifest → sw.js -->
  <path d="M596,136 V152" fill="none" stroke="#4f5d75" stroke-width="0.8" marker-end="url(#wa-arr)"/>

  <!-- sw.js -->
  <rect x="540" y="152" width="112" height="32" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
  <text x="596" y="168" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">sw.js</text>
  <text x="596" y="179" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399" text-anchor="middle">service worker · cache v3</text>

  <!-- ── Script load zone (center-left) ── -->
  <rect x="48" y="140" width="460" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="60" y="136" width="128" height="12" rx="2" fill="#f5f5f5"/>
  <text x="124" y="145" font-family="'Geist Mono', monospace" font-size="7" fill="rgba(45,49,66,0.40)" text-anchor="middle" letter-spacing="0.14em">&lt;script&gt; LOAD ORDER</text>

  <!-- Arrow: index.html → script zone -->
  <path d="M340,120 V148" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#wa-arr-accent)"/>

  <!-- sgf-parser.js -->
  <rect x="60" y="152" width="200" height="36" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="160" y="168" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">sgf-parser.js</text>
  <text x="160" y="180" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">SgfEngine — loaded inside annotation_v4</text>

  <!-- deadstones.bundle -->
  <rect x="60" y="196" width="200" height="36" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="160" y="212" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">deadstones.bundle.js</text>
  <text x="160" y="224" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">deadstones_bg.wasm · AI dead map</text>

  <!-- board-estimate.js -->
  <rect x="60" y="240" width="200" height="36" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="160" y="256" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">board-estimate.js</text>
  <text x="160" y="268" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">evaluateJapaneseTerritory</text>

  <!-- goscorer.js -->
  <rect x="60" y="284" width="200" height="36" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="160" y="300" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">goscorer.js</text>
  <text x="160" y="312" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">GoScorer.finalTerritoryScore</text>

  <!-- liberties.js -->
  <rect x="268" y="152" width="224" height="36" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="380" y="168" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">liberties.js</text>
  <text x="380" y="180" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">Liberties · qi / BFS groups</text>

  <!-- move-term-detector.js -->
  <rect x="268" y="196" width="224" height="36" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="380" y="212" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">move-term-detector.js</text>
  <text x="380" y="224" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">_termHL · Sabaki patterns · Tenuki/Sente/Gote</text>

  <!-- phase-detector.js -->
  <rect x="268" y="240" width="224" height="36" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="380" y="256" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">phase-detector.js</text>
  <text x="380" y="268" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">detectGamePhaseDynamic · Fuseki/Chuban/Yose</text>

  <!-- game-tree.js -->
  <rect x="268" y="284" width="224" height="36" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="380" y="300" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">game-tree.js</text>
  <text x="380" y="312" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">refreshGameTree · move tree rendering</text>

  <!-- Arrows: all scripts → annotation_v4.js (via vertical drop) -->
  <path d="M160,320 V356" fill="none" stroke="#4f5d75" stroke-width="0.8" marker-end="url(#wa-arr)"/>
  <path d="M380,320 V356" fill="none" stroke="#4f5d75" stroke-width="0.8" marker-end="url(#wa-arr)"/>

  <!-- annotation_v4.js THE HUB -->
  <rect x="48" y="356" width="460" height="108" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="278" y="380" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">annotation_v4.js</text>
  <text x="278" y="394" font-family="'Geist Mono', monospace" font-size="7.5" fill="#eb6c36" text-anchor="middle" letter-spacing="0.08em">THE HUB</text>
  <text x="278" y="410" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">window.state · event listeners · canvas draw · exports</text>
  <text x="278" y="424" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">loadSGF → SgfEngine.parseSgf / extractMainLine</text>
  <text x="278" y="438" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">runScoreEstimate · GoScorer · deadstones.guess</text>
  <text x="278" y="452" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">Liberties · phase-detector · _termHL · game-tree</text>

</svg>
</body>
</html>
