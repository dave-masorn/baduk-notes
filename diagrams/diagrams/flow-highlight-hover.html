<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highlight Hover Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f5f5f5; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<svg role="img" aria-labelledby="flow-highlight-hover-title flow-highlight-hover-desc" viewBox="0 0 560 520" width="560" height="520" xmlns="http://www.w3.org/2000/svg">
  <title id="flow-highlight-hover-title">Highlight Hover Flow</title>
  <desc id="flow-highlight-hover-desc">Highlight Hover Flow diagram for baduk-notes documentation.</desc>
<defs>
    <marker id="hh-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4f5d75"/>
    </marker>
    <marker id="hh-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="560" height="520" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="280" y="28" font-family="'Instrument Serif', serif" font-size="17" fill="#2d3142" text-anchor="middle">Highlight Hover</text>
  <text x="280" y="44" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle" letter-spacing="0.12em">BADGE MOUSEENTER/MOUSELEAVE → HIGHLIGHT STATE → DRAW</text>

  <!-- ── ENTER SIDE ── -->
  <!-- Zone label -->
  <rect x="24" y="60" width="248" height="352" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="36" y="56" width="68" height="12" rx="2" fill="#f5f5f5"/>
  <text x="70" y="65" font-family="'Geist Mono', monospace" font-size="7" fill="rgba(45,49,66,0.40)" text-anchor="middle" letter-spacing="0.14em">MOUSEENTER</text>

  <!-- Badge mouseenter -->
  <rect x="36" y="68" width="224" height="36" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="148" y="83" font-family="'Geist', sans-serif" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">Badge mouseenter</text>
  <text x="148" y="97" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">_termHL event</text>

  <line x1="148" y1="104" x2="148" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#hh-arr)"/>

  <!-- _termHL.show() -->
  <rect x="36" y="120" width="224" height="36" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="148" y="135" font-family="'Geist', sans-serif" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">_termHL.show()</text>
  <text x="148" y="149" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">_active = true</text>

  <line x1="148" y1="156" x2="148" y2="172" stroke="#4f5d75" stroke-width="1" marker-end="url(#hh-arr)"/>

  <!-- Set globals -->
  <rect x="36" y="172" width="224" height="48" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="148" y="187" font-family="'Geist', sans-serif" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">Set highlight globals</text>
  <text x="148" y="201" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">window._highlightedCells = this.blue</text>
  <text x="148" y="213" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">window._responseVertices = this.green</text>

  <line x1="148" y1="220" x2="148" y2="236" stroke="#4f5d75" stroke-width="1" marker-end="url(#hh-arr)"/>

  <!-- drawBoard enter -->
  <rect x="36" y="236" width="224" height="48" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="148" y="251" font-family="'Geist', sans-serif" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">drawBoard()</text>
  <text x="148" y="265" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">blue CIRCLE_F fills · green fills</text>
  <text x="148" y="277" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">connection rects · ring + atari triangles</text>

  <!-- Done enter -->
  <line x1="148" y1="284" x2="148" y2="300" stroke="#4f5d75" stroke-width="1" marker-end="url(#hh-arr)"/>
  <rect x="64" y="300" width="168" height="28" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
  <text x="148" y="319" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">Highlights visible</text>

  <!-- ── LEAVE SIDE ── -->
  <rect x="288" y="60" width="248" height="352" rx="8" fill="rgba(46,90,168,0.02)" stroke="rgba(46,90,168,0.15)" stroke-width="0.8"/>
  <rect x="300" y="56" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="336" y="65" font-family="'Geist Mono', monospace" font-size="7" fill="rgba(46,90,168,0.50)" text-anchor="middle" letter-spacing="0.14em">MOUSELEAVE</text>

  <!-- Badge mouseleave -->
  <rect x="300" y="68" width="224" height="36" rx="6" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.2"/>
  <text x="412" y="83" font-family="'Geist', sans-serif" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">Badge mouseleave</text>
  <text x="412" y="97" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">_termHL event</text>

  <line x1="412" y1="104" x2="412" y2="120" stroke="#2e5aa8" stroke-width="1" marker-end="url(#hh-arr-link)"/>

  <!-- _termHL.hide() -->
  <rect x="300" y="120" width="224" height="36" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="412" y="135" font-family="'Geist', sans-serif" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">_termHL.hide()</text>
  <text x="412" y="149" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">_active = false</text>

  <line x1="412" y1="156" x2="412" y2="172" stroke="#2e5aa8" stroke-width="1" marker-end="url(#hh-arr-link)"/>

  <!-- Clear globals -->
  <rect x="300" y="172" width="224" height="48" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="412" y="187" font-family="'Geist', sans-serif" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">Clear highlight globals</text>
  <text x="412" y="201" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">window._highlightedCells = []</text>
  <text x="412" y="213" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">window._responseVertices = []</text>

  <line x1="412" y1="220" x2="412" y2="236" stroke="#2e5aa8" stroke-width="1" marker-end="url(#hh-arr-link)"/>

  <!-- drawBoard leave -->
  <rect x="300" y="236" width="224" height="48" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="412" y="251" font-family="'Geist', sans-serif" font-size="10.5" font-weight="600" fill="#2d3142" text-anchor="middle">drawBoard()</text>
  <text x="412" y="265" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">clean board · no fills</text>
  <text x="412" y="277" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">no connection rects · no rings</text>

  <!-- Done leave -->
  <line x1="412" y1="284" x2="412" y2="300" stroke="#2e5aa8" stroke-width="1" marker-end="url(#hh-arr-link)"/>
  <rect x="328" y="300" width="168" height="28" rx="6" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="0.8"/>
  <text x="412" y="319" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">Board cleared</text>

  <!-- Legend strip -->
  <line x1="28" y1="436" x2="528" y2="436" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="28" y="452" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399" letter-spacing="0.10em">LEGEND</text>

  <!-- Orange enter indicator -->
  <rect x="80" y="460" width="12" height="12" rx="2" fill="rgba(235,108,54,0.20)" stroke="#eb6c36" stroke-width="1"/>
  <text x="100" y="471" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">hover enter path</text>

  <!-- Blue leave indicator -->
  <rect x="240" y="460" width="12" height="12" rx="2" fill="rgba(46,90,168,0.15)" stroke="#2e5aa8" stroke-width="1"/>
  <text x="260" y="471" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399">hover leave path</text>

  <!-- _termHL note -->
  <text x="280" y="500" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">_termHL object holds blue/green vertex sets and manages _active state</text>

</svg>
</body>
</html>
