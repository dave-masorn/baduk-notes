<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Load Order</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f5f5f5; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 560 400" width="560" height="400" role="img" aria-labelledby="slo-title" xmlns="http://www.w3.org/2000/svg">
  <title id="slo-title">Script Load Order — index.html script dependency tree</title>
  <defs>
    <marker id="slo-arr" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#4f5d75"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="560" height="400" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="280" y="28" font-family="'Instrument Serif', serif" font-size="17" fill="#2d3142" text-anchor="middle">Script Load Order</text>
  <text x="280" y="44" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle" letter-spacing="0.12em">DEPENDENCY TREE · index.html ENTRY POINT</text>

  <!-- Root: index.html -->
  <rect x="176" y="60" width="208" height="40" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="280" y="78" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">index.html</text>
  <text x="280" y="92" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">entry point · deferred &lt;script&gt; tags</text>

  <!-- Trunk line down from index.html -->
  <line x1="280" y1="100" x2="280" y2="120" stroke="#4f5d75" stroke-width="1"/>

  <!-- annotation_v4.js — main node -->
  <rect x="60" y="120" width="440" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="280" y="138" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="middle">annotation_v4.js</text>
  <text x="280" y="152" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">loaded first — sets up state, board, UI · THE HUB</text>

  <!-- Line from annotation_v4 → sgf-parser (child) -->
  <line x1="280" y1="160" x2="280" y2="176" stroke="#4f5d75" stroke-width="1"/>
  <!-- sgf-parser indented -->
  <line x1="280" y1="168" x2="310" y2="168" stroke="#4f5d75" stroke-width="0.8"/>
  <rect x="310" y="168" width="210" height="32" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
  <text x="415" y="182" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">sgf-parser.js</text>
  <text x="415" y="194" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399" text-anchor="middle">SgfEngine · loaded inside annotation_v4</text>

  <!-- Bus line for siblings -->
  <line x1="140" y1="176" x2="140" y2="368" stroke="#4f5d75" stroke-width="0.8"/>

  <!-- game-tree.js -->
  <line x1="140" y1="216" x2="168" y2="216" stroke="#4f5d75" stroke-width="0.8" marker-end="url(#slo-arr)"/>
  <rect x="168" y="200" width="240" height="32" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
  <text x="288" y="214" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">game-tree.js</text>
  <text x="288" y="226" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399" text-anchor="middle">game tree rendering</text>

  <!-- move-term-detector.js -->
  <line x1="140" y1="256" x2="168" y2="256" stroke="#4f5d75" stroke-width="0.8" marker-end="url(#slo-arr)"/>
  <rect x="168" y="240" width="240" height="32" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
  <text x="288" y="254" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">move-term-detector.js</text>
  <text x="288" y="266" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399" text-anchor="middle">move term detection &amp; highlights</text>

  <!-- board-estimate.js -->
  <line x1="140" y1="296" x2="168" y2="296" stroke="#4f5d75" stroke-width="0.8" marker-end="url(#slo-arr)"/>
  <rect x="168" y="280" width="240" height="32" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
  <text x="288" y="294" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">board-estimate.js</text>
  <text x="288" y="306" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399" text-anchor="middle">score estimation</text>

  <!-- liberties.js -->
  <line x1="140" y1="336" x2="168" y2="336" stroke="#4f5d75" stroke-width="0.8" marker-end="url(#slo-arr)"/>
  <rect x="168" y="320" width="240" height="32" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
  <text x="288" y="334" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">liberties.js</text>
  <text x="288" y="346" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399" text-anchor="middle">liberty analysis · BFS groups</text>

  <!-- phase-detector.js -->
  <line x1="140" y1="368" x2="168" y2="368" stroke="#4f5d75" stroke-width="0.8" marker-end="url(#slo-arr)"/>
  <rect x="168" y="352" width="240" height="32" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
  <text x="288" y="366" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">phase-detector.js</text>
  <text x="288" y="378" font-family="'Geist Mono', monospace" font-size="7" fill="#7a8399" text-anchor="middle">game phase detection · Fuseki/Chuban/Yose</text>

</svg>
</body>
</html>
