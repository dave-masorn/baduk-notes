<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSOT Sync System</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f5f5f5; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 680 380" width="680" height="380" role="img" aria-labelledby="ssot-title" xmlns="http://www.w3.org/2000/svg">
  <title id="ssot-title">SSOT Sync System — one source of truth, zero drift</title>
  <defs>
    <marker id="ssot-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4f5d75"/>
    </marker>
    <marker id="ssot-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="380" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="340" y="28" font-family="'Instrument Serif', serif" font-size="17" fill="#2d3142" text-anchor="middle">SSOT Sync System</text>
  <text x="340" y="44" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle" letter-spacing="0.12em">ONE SOURCE OF TRUTH · ZERO DRIFT</text>

  <!-- Zone: Source -->
  <rect x="220" y="60" width="240" height="56" rx="8" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
  <!-- Focal node: SITEMAP.md -->
  <text x="240" y="74" font-family="'Geist Mono', monospace" font-size="7" fill="#eb6c36" letter-spacing="0.14em">SOURCE OF TRUTH</text>
  <text x="340" y="92" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">SITEMAP.md</text>
  <text x="340" y="107" font-family="'Geist Mono', monospace" font-size="8.5" fill="#7a8399" text-anchor="middle">frontmatter version: + H2/H3 headings</text>

  <!-- Arrow: SITEMAP.md → sync-docs.js -->
  <path d="M340,116 V140" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ssot-arr-accent)"/>
  <rect x="305" y="124" width="70" height="12" rx="2" fill="#f5f5f5"/>
  <text x="340" y="133" font-family="'Geist Mono', monospace" font-size="7.5" fill="#eb6c36" text-anchor="middle">node sync-docs.js</text>

  <!-- sync-docs.js node -->
  <rect x="260" y="140" width="160" height="48" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="340" y="160" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142" text-anchor="middle">sync-docs.js</text>
  <text x="340" y="175" font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399" text-anchor="middle">single sync engine</text>
  <text x="340" y="186" font-family="'Geist Mono', monospace" font-size="7.5" fill="#4f5d75" text-anchor="middle">syncVersion() + content sync</text>

  <!-- Three output branches -->

  <!-- Branch left: index.html consumers -->
  <!-- Arrow sync-docs.js → left group -->
  <path d="M260,164 H160 V224" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#ssot-arr)"/>
  <rect x="72" y="168" width="84" height="12" rx="2" fill="#f5f5f5"/>
  <text x="114" y="177" font-family="'Geist Mono', monospace" font-size="7" fill="#4f5d75" text-anchor="middle">version sync</text>

  <!-- Left group zone -->
  <rect x="48" y="224" width="224" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="60" y="220" width="98" height="12" rx="2" fill="#f5f5f5"/>
  <text x="110" y="229" font-family="'Geist Mono', monospace" font-size="7" fill="rgba(45,49,66,0.40)" text-anchor="middle" letter-spacing="0.14em">VERSION CONSUMERS</text>

  <!-- index.html node -->
  <rect x="60" y="236" width="200" height="40" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
  <text x="160" y="252" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">index.html</text>
  <text x="160" y="265" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">header link label + ?v= cache-busters</text>

  <!-- version.ts node -->
  <rect x="60" y="284" width="200" height="36" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
  <text x="160" y="299" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">tech-log/src/lib/version.ts</text>
  <text x="160" y="312" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">TECH_LOG_VERSION = '0.x.xxx'</text>

  <!-- redirect node -->
  <rect x="60" y="328" width="200" height="16" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="160" y="340" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">tech_log-{version}.html redirect</text>

  <!-- Branch right: content build -->
  <!-- Arrow sync-docs.js → right group -->
  <path d="M420,164 H520 V224" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#ssot-arr)"/>
  <rect x="446" y="168" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="490" y="177" font-family="'Geist Mono', monospace" font-size="7" fill="#4f5d75" text-anchor="middle">content sync</text>

  <!-- Right group zone -->
  <rect x="408" y="224" width="244" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="420" y="220" width="96" height="12" rx="2" fill="#f5f5f5"/>
  <text x="468" y="229" font-family="'Geist Mono', monospace" font-size="7" fill="rgba(45,49,66,0.40)" text-anchor="middle" letter-spacing="0.14em">BUILD PIPELINE</text>

  <!-- MDX node -->
  <rect x="420" y="236" width="220" height="40" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
  <text x="530" y="252" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">tech-log/content/docs/*.mdx</text>
  <text x="530" y="265" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">H2 → MDX pages + meta.json</text>

  <!-- next build arrow -->
  <path d="M530,276 V284" fill="none" stroke="#4f5d75" stroke-width="0.8" marker-end="url(#ssot-arr)"/>

  <!-- tech-log/out node -->
  <rect x="420" y="284" width="220" height="36" rx="6" fill="#ffffff" stroke="#bfc0c0" stroke-width="0.8"/>
  <text x="530" y="299" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142" text-anchor="middle">tech-log/out/ → tech-log-dist/</text>
  <text x="530" y="312" font-family="'Geist Mono', monospace" font-size="7.5" fill="#7a8399" text-anchor="middle">npx next build --webpack</text>

  <!-- served arrow -->
  <path d="M530,320 V328" fill="none" stroke="#4f5d75" stroke-width="0.8" marker-end="url(#ssot-arr)"/>

  <!-- served node -->
  <rect x="420" y="328" width="220" height="16" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2e5aa8" stroke-width="0.8"/>
  <text x="530" y="340" font-family="'Geist Mono', monospace" font-size="7.5" fill="#2e5aa8" text-anchor="middle">localhost:8577/tech-log-dist/docs/</text>

</svg>
</body>
</html>
