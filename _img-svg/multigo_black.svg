<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Drop Shadow matching the Canvas shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.5" />
    </filter>
    
    <!-- Directional Radial Gradient -->
    <radialGradient id="stoneGrad" cx="45%" cy="45%" r="55%" fx="35%" fy="35%" fr="5%">
      <stop offset="0%" stop-color="#5a5a5a" />
      <stop offset="40%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
  </defs>
  
  <circle cx="128" cy="128" r="100" fill="url(#stoneGrad)" filter="url(#shadow)" />
</svg>
